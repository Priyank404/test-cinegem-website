  <!DOCTYPE html>
<html lang="en" class="dark" style="background:#000000;background-color:#000000;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="description"
      content="Cinegem Studio — Luxury jewelry rendering, 3D visualization, and cinematic animation for the world's finest maisons."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Cinegem Studio — High Jewellery CGI & 3D Visualization" />
    <meta
      property="og:description"
      content="Where light, form, and precision converge. Luxury jewelry rendering studio."
    />
    <meta property="og:type" content="website" />

    <!-- Preconnect for CDN media performance -->
    <link rel="preconnect" href="https://media.cinegemstudio.com" crossorigin />

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <!-- LCP Discovery: Preload primary content image first with high priority -->
    <link rel="preload" as="image" href="/Logo.png" fetchpriority="high" />

    <!-- Preload Draco decoder and base ring assets with low priority to prevent network contention with Logo & JS -->
    <link rel="preload" as="fetch" type="application/octet-stream" crossorigin href="/models/ring-draco.glb" fetchpriority="low" />
    <link rel="preload" as="fetch" type="application/wasm" crossorigin href="/draco/draco_decoder.wasm" fetchpriority="low" />
    <link rel="preload" as="script" crossorigin href="/draco/draco_wasm_wrapper.js" fetchpriority="low" />
    <link rel="preload" as="fetch" type="application/octet-stream" crossorigin href="/hdr/env_metal_001_d01c4504e0.hdr" fetchpriority="low" />
    <script>
      (function() {
        try {
          var isMobile = (window.innerWidth < 768) || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
          // Preload the lightweight mobile EXR (561 KB) early with low priority; avoid preloading the 7.5 MB desktop EXR in HTML to prevent network contention with JS chunks
          if (isMobile) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'fetch';
            link.type = 'application/octet-stream';
            link.crossOrigin = 'anonymous';
            link.setAttribute('fetchpriority', 'low');
            link.href = '/hdr/Diamond-Base-HDRI-mobile.exr';
            document.head.appendChild(link);
          }
        } catch (_) {}
      })();
    </script>

    <title>Cinegem Studio — High Jewellery CGI & 3D Visualization</title>
    <script>
      (function() {
        window.__earlyErrors = [];
        window.addEventListener('error', function(e) {
          window.__earlyErrors.push({ message: e.message, filename: e.filename, lineno: e.lineno });
        });
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #000000; background: #000000;">

  </body>
</html>
