.rl-wrap{display:flex;flex-direction:column;align-items:center;}.rl-svg{width:clamp(150px,40vw,210px);height:auto;overflow:visible;display:block;transform:translateZ(0);will-change:transform;}.rl-svg{--pink:#c9446f;--ease:cubic-bezier(.65,0,.35,1);--t-guides:0s;--t-band:.5s;--t-gem:1.3s;--t-lines:1.9s;--t-out:2.2s;--t-fill:2.4s;--t-spark:3.1s;}.rl-guides{stroke:var(--pink);stroke-width:.7;opacity:0;animation:rl-guides-out .5s ease var(--t-out) both;}.rl-g{stroke-dasharray:2 3;transform-box:view-box;}.rl-gx{transform-origin:100px 138px;animation:rl-grow-x .6s var(--ease) var(--t-guides) both;}.rl-gy{transform-origin:100px 119px;animation:rl-grow-y .6s var(--ease) var(--t-guides) both;}.rl-gc{transform-origin:100px 138px;animation:rl-grow .6s var(--ease) var(--t-guides) both;}.rl-gem-g1{transform-origin:100px 72.5px;animation:rl-grow-x .6s var(--ease) calc(var(--t-gem) - .4s) both;}.rl-gem-g2{transform-origin:100px 62px;animation:rl-grow-x .6s var(--ease) calc(var(--t-gem) - .4s) both;}.rl-gem-g3{transform-origin:100px 77px;animation:rl-grow-y .6s var(--ease) calc(var(--t-gem) - .4s) both;}.rl-arm{fill:var(--pink);stroke:var(--pink);stroke-width:.7;transform-box:view-box;transform-origin:100px 138px;animation:rl-spin 1.3s var(--ease) var(--t-band) both,rl-fade-in .2s linear var(--t-band) both;}.rl-band{stroke:#ffffff;stroke-width:4.5;stroke-linecap:round;fill:none;stroke-dasharray:277 280;stroke-dashoffset:0;animation:rl-draw-band 1.3s var(--ease) var(--t-band) both;}@keyframes rl-draw-band{0%{stroke-dashoffset:277;}100%{stroke-dashoffset:0;}}.rl-gem-line{stroke:#ffffff;stroke-width:1.6;stroke-linejoin:round;fill:none;stroke-dasharray:109 115;stroke-dashoffset:0;animation:rl-draw-gem .9s var(--ease) var(--t-gem) both;}@keyframes rl-draw-gem{0%{stroke-dashoffset:109;}100%{stroke-dashoffset:0;}}.rl-facet-lines{stroke:#ffffff;stroke-width:.7;animation:rl-fade-in .3s ease var(--t-lines) both;}.rl-collar{fill:#ffffff;animation:rl-fade-in .3s ease var(--t-lines) both;}.rl-f
